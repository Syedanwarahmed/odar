global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: odar_oracle
    scrape_timeout: 20s
    static_configs:
      - targets: ['localhost:9161']
        labels:
          cluster: 'RACDB'
